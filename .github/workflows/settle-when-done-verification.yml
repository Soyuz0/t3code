name: Settle when done verification
on:
  push:
    branches: [verify/settle-when-done]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAYON_NUM_THREADS: "2"
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --max-old-space-size=4096
      T3CODE_BUNDLED_DEV: "0"
      T3CODE_WEB_SOURCEMAP: "0"
      CAPTURE_SHA: "1c54053701ab24a4de132c026ae6d48d72b4d9f8"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1c54053701ab24a4de132c026ae6d48d72b4d9f8
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Capture desktop and phone-sized web
        run: |
          echo '' | base64 -d > scripts/scenarios/capture-ui.ts
          node scripts/scenarios/capture-ui.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: settle-ui-screenshots
          path: ui-captures
